# Runs the installers on fresh machines, skipping only what needs a person
# (GitHub sign-in) and the private claude-standards repo.
name: Test installers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TB_NAME: CI Test
  TB_EMAIL_IO: ci@thoughtbox.io
  TB_EMAIL_ONE: ci@thoughtbox.one
  TB_SKIP_SIGNIN: '1'
  TB_SKIP_STANDARDS: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dry run changes nothing
        run: |
          TB_DRY_RUN=1 bash install.sh </dev/null
          test ! -e "$HOME/.gita"
      - name: Install (piped, like the one-liner)
        run: cat install.sh | bash
      - name: Gita works
        run: |
          "$HOME/.gita/bin/gita" --version
          "$HOME/.gita/bin/gita" profiles --json | grep -q ci@thoughtbox.io
          "$HOME/.gita/bin/gita" profiles --json | grep -q ci@thoughtbox.one
      - name: macOS app is intact and matches ~/.gita
        if: runner.os == 'macOS'
        run: |
          app="$HOME/Applications/gita.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/cli/bin/gita" --version
          cmp "$app/Contents/Resources/cli/bin/gita" "$HOME/.gita/bin/gita"
      - name: Second run skips finished steps
        run: |
          bash install.sh </dev/null 2>&1 | tee run2.log
          grep -q "Gita .* is installed" run2.log
          grep -q "Profile for ci@thoughtbox.io already exists" run2.log
      - name: Figma step is skipped without a terminal
        run: |
          bash install.sh </dev/null 2>&1 | tee run3.log
          if grep -q "Setting up Figma" run3.log; then exit 1; fi
          test ! -e "$HOME/.thoughtbox/figma-mcp-bridge"
      - name: Figma step on Linux says it isn't available
        if: runner.os == 'Linux'
        run: |
          TB_FIGMA=1 bash install.sh </dev/null 2>&1 | tee run4.log
          grep -q "isn't available on Linux" run4.log

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Stops with a clear message
        run: |
          if bash install.sh </dev/null >out.log 2>&1; then cat out.log; exit 1; fi
          cat out.log
          grep -q "only built for Apple silicon" out.log

  figma-macos:
    runs-on: macos-latest
    env:
      TB_FIGMA: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Dry run changes nothing
        run: |
          TB_DRY_RUN=1 bash install.sh </dev/null
          test ! -e "$HOME/.thoughtbox/figma-mcp-bridge"
      - name: Install with the Figma step
        run: |
          cat install.sh | bash 2>&1 | tee run1.log
          grep -q "Import plugin from manifest" run1.log
      - name: Bridge, plugin and Claude Code entry are in place
        run: |
          dir="$HOME/.thoughtbox/figma-mcp-bridge"
          test "$(cat "$dir/version")" = 0.0.25
          test -f "$dir/plugin/manifest.json"
          test -f "$dir/server/node_modules/@gethopp/figma-mcp-bridge/dist/index.js"
          export PATH="$HOME/.local/bin:$PATH"
          claude mcp get figma-bridge | tee mcp.log
          grep -q "FIGMA_BRIDGE_ENABLE_RUN_SCRIPT=1" mcp.log
      - name: Second run skips finished Figma steps
        run: |
          bash install.sh </dev/null 2>&1 | tee run2.log
          grep -q "Figma MCP Bridge 0.0.25 is installed" run2.log
          grep -q "figma-bridge is already in Claude Code" run2.log

  figma-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TB_FIGMA: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install with the Figma step
        shell: pwsh
        run: ./install.ps1
      - name: Bridge, plugin and Claude Code entry are in place
        shell: pwsh
        run: |
          $dir = Join-Path $HOME '.thoughtbox/figma-mcp-bridge'
          if ((Get-Content "$dir/version").Trim() -ne '0.0.25') { throw 'wrong version' }
          if (-not (Test-Path "$dir/plugin/manifest.json")) { throw 'no plugin' }
          if (-not (Test-Path "$dir/server/node_modules/@gethopp/figma-mcp-bridge/dist/index.js")) { throw 'no server' }
          $env:Path = "$HOME/.local/bin;$env:Path"
          $out = claude mcp get figma-bridge | Out-String
          $out
          if ($out -notmatch 'FIGMA_BRIDGE_ENABLE_RUN_SCRIPT=1') { throw 'no Claude Code entry' }
      - name: Second run skips finished Figma steps
        shell: pwsh
        run: |
          $log = ./install.ps1 *>&1 | Out-String
          $log
          if ($log -notmatch 'Figma MCP Bridge 0.0.25 is installed') { throw 'reinstalled' }
          if ($log -notmatch 'figma-bridge is already in Claude Code') { throw 're-added' }

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install
        shell: pwsh
        run: ./install.ps1
      - name: Gita works
        shell: pwsh
        run: |
          $gita = Get-Command gita -ErrorAction SilentlyContinue
          if (-not $gita) { $gita = Get-ChildItem "$HOME\.gita\bin\gita.exe" }
          & $gita --version
          if ($LASTEXITCODE -ne 0) { throw "gita doesn't run" }
