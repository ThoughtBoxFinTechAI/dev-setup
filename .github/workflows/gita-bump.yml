# Opens a pull request when Gita has a newer published release, with the new
# version and checksums pinned in install.sh and install.ps1. A person reviews
# and merges it; nothing is installed from an unpinned release.
# Needs the repository setting "Allow GitHub Actions to create and approve
# pull requests" (Settings > Actions > General).
name: Update pinned Gita

on:
  schedule:
    - cron: '23 5 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # to start the installer tests on the bot's branch (see below)

concurrency:
  group: gita-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Check the latest Gita release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gita-bump.sh
      - name: Open a pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="bot/gita-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A pull request branch for Gita $VERSION already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(gita): pin Gita $VERSION" \
            -m "Version and SHA-256 checksums from the release's SHA256SUMS, checked by scripts/gita-bump.sh."
          git push origin "$branch"
          {
            echo "Gita $VERSION is published. This updates the version and checksums pinned in install.sh and install.ps1."
            echo
            echo "- Every download matched the release's SHA256SUMS."
            echo "- The Linux build started and reported \`gita $VERSION\`."
            echo "- The installer tests were started on this branch (\"Test installers\" in the Actions tab)."
            echo
            echo "Please read the release notes at https://github.com/naseebnaushad/gita/releases/tag/v$VERSION before merging."
          } >pr-body.md
          gh pr create --base main --head "$branch" \
            --title "chore(gita): pin Gita $VERSION" --body-file pr-body.md
          # Pull requests opened with this workflow's token don't start other
          # workflows, so start the installer tests on the branch explicitly.
          gh workflow run test-install.yml --ref "$branch"
